services:
  remediation:
    build:
      context: .
      dockerfile: Dockerfile
    image: montefiore-pdfua-remediation:latest
    container_name: montefiore-remediation

    # Load environment from .env
    # Copy .env.example to .env and fill in your values before starting.
    env_file:
      - .env

    # Workspace volume — all PDFs and job data live on the host.
    # Set WORKSPACE_PATH in .env to an absolute path on your machine.
    volumes:
      - ${WORKSPACE_PATH:-./workspace}:/app/workspace

    # Keep container running for exec access
    stdin_open: true
    tty: true

    restart: "no"
