services:
  remediation:
    build:
      context: .
      dockerfile: Dockerfile
    image: montefiore-pdfua-remediation:latest
    container_name: montefiore-remediation

    env_file:
      - .env

    ports:
      # OpenClaw web UI — access at http://127.0.0.1:18789
      - "127.0.0.1:18789:18789"

    volumes:
      - ${WORKSPACE_PATH:-./workspace}:/app/workspace

    stdin_open: true
    tty: true

    restart: "no"
